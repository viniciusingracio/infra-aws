---
- name: Atualizar e configurar servidor Ubuntu
  hosts: ubuntu
  become: true
  gather_facts: true

  vars:
    reboot_if_required: false

    base_packages:
      - curl
      - wget
      - git
      - vim
      - htop
      - unzip
      - ca-certificates
      - gnupg
      - lsb-release
      - net-tools
      - jq
      - tree

  tasks:
    - name: Aguardar cloud-init finalizar
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Atualizar cache do apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Atualizar pacotes do sistema operacional
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Instalar pacotes básicos
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present

    - name: Criar mensagem de login
      ansible.builtin.copy:
        dest: /etc/motd
        owner: root
        group: root
        mode: "0644"
        content: |
          Servidor Ubuntu configurado com Ansible.
          Projeto: Terraform + Ansible + AWS

    - name: Verificar se o sistema precisa reiniciar
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Mostrar aviso de reinicialização
      ansible.builtin.debug:
        msg: "O Ubuntu indicou que precisa reiniciar. Rode com -e reboot_if_required=true para reiniciar automaticamente."
      when: reboot_required_file.stat.exists and not reboot_if_required

    - name: Reiniciar se necessário e autorizado
      ansible.builtin.reboot:
        msg: "Reiniciando após atualizações aplicadas pelo Ansible"
        connect_timeout: 5
        reboot_timeout: 600
      when: reboot_required_file.stat.exists and reboot_if_required
